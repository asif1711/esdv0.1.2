<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyYou | Face Verification</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

    <style>

        .auth__card{
            position: relative;
            overflow: hidden;
        }

        .auth__card::before{
            content:"";
            position:absolute;
            width:180px;
            height:180px;
            background:rgba(255,0,85,0.08);
            border-radius:50%;
            top:-60px;
            right:-60px;
            filter:blur(40px);
        }

        .verify-subtitle{
            text-align:center;
            color:#9ca3af;
            font-size:14px;
            margin-bottom:24px;
            line-height:1.6;
        }

        .camera-wrapper{
            position:relative;
            width:320px;
            margin:auto;
            border-radius:18px;
            overflow:hidden;
            border:1px solid rgba(255,255,255,0.08);
            background:#0f172a;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03),
                0 15px 35px rgba(0,0,0,0.35);
        }

        .camera-overlay{
            position:absolute;
            inset:0;
            border:2px solid rgba(255,255,255,0.08);
            border-radius:18px;
            pointer-events:none;
        }

        .scanner-line{
            position:absolute;
            width:100%;
            height:3px;
            background:linear-gradient(
                90deg,
                transparent,
                #ff3b5f,
                transparent
            );
            animation:scan 2.2s linear infinite;
            z-index:3;
        }

        @keyframes scan{
            0%{
                top:0;
            }
            100%{
                top:100%;
            }
        }

        #video{
            width:100%;
            height:240px;
            object-fit:cover;
            transform:scaleX(-1);
        }

        .camera-label{
            position:absolute;
            top:12px;
            left:12px;
            background:rgba(0,0,0,0.45);
            padding:6px 12px;
            border-radius:30px;
            font-size:12px;
            font-weight:600;
            backdrop-filter:blur(6px);
            letter-spacing:0.5px;
        }

        .status-box{
            margin-top:22px;
            text-align:center;
            min-height:65px;
        }

        #status{
            font-weight:600;
            font-size:15px;
            transition:0.3s;
        }

        .success-state{

            background:rgba(34,197,94,0.08);
            border:1px solid rgba(34,197,94,0.25);
            color:#22c55e !important;

            padding:14px;
            border-radius:14px;

            display:inline-flex;
            align-items:center;
            gap:12px;

            animation:pop 0.3s ease;
        }

        .error-state{

            background:rgba(255,59,95,0.08);
            border:1px solid rgba(255,59,95,0.22);
            color:#ff4d6d !important;

            padding:14px;
            border-radius:14px;

            display:inline-flex;
            align-items:center;
            gap:12px;
        }

        @keyframes pop{
            from{
                transform:scale(0.9);
                opacity:0;
            }
            to{
                transform:scale(1);
                opacity:1;
            }
        }

        .success-icon{

            width:34px;
            height:34px;

            border-radius:50%;
            background:#22c55e;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:18px;
            color:white;

            box-shadow:0 0 18px rgba(34,197,94,0.45);
        }

        .verify-meta{
            display:flex;
            justify-content:space-between;
            margin-top:18px;
            margin-bottom:12px;
            color:#6b7280;
            font-size:12px;
        }

        #verifyBtn{
            margin-top:12px;
            position:relative;
            overflow:hidden;
        }

        #verifyBtn::before{
            content:"";
            position:absolute;
            width:120%;
            height:100%;
            background:linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,0.12),
                transparent
            );
            left:-120%;
            top:0;
            transition:0.6s;
        }

        #verifyBtn:hover::before{
            left:100%;
        }

    </style>
</head>

<body>

<section class="auth">

    <div class="auth__container">

        <!-- LEFT -->
        <div class="auth__left">

            <div class="brand">

                <img src="img/logo.png" class="brand__logo--large" />

                <p class="brand__tagline">
                    Secure access. Only you.
                </p>

            </div>

        </div>

        <!-- RIGHT -->
        <div class="auth__right">

            <div class="auth__card">

                <h2>Face Verification</h2>

                <div class="divider"></div>

                <p class="verify-subtitle">
                    AI-powered biometric authentication required
                    before secure access continuation.
                </p>

                <!-- CAMERA -->
                <div class="camera-wrapper">

                    <div class="scanner-line"></div>

                    <div class="camera-overlay"></div>

                    <div class="camera-label">
                        LIVE SECURITY SCAN
                    </div>

                    <video id="video" autoplay></video>

                </div>

                <div class="verify-meta">
                    <span>Biometric Authentication</span>
                    <span>Level 2 Security</span>
                </div>

                <!-- STATUS -->
                <div class="status-box">
                    <div id="status"></div>
                </div>

                <!-- BUTTON -->
                <button onclick="capture()" id="verifyBtn">

                    <span class="btn-text">
                        Verify Identity
                    </span>

                </button>

                <!-- DEV BYPASS -->
                <div style="margin-top: 16px; text-align: center;">
                    <a href="event.php" style="font-size: 11px; color: rgba(255,255,255,0.2); text-decoration: none; letter-spacing: 0.5px; transition: color 0.3s;" onmouseover="this.style.color='rgba(255,59,95,0.65)'" onmouseout="this.style.color='rgba(255,255,255,0.2)'">
                        ✦ DEV BYPASS BIOMETRICS ✦
                    </a>
                </div>

            </div>

        </div>

    </div>

</section>

<script>

const video = document.getElementById('video');
const statusText = document.getElementById('status');
const btn = document.getElementById('verifyBtn');


// OPEN CAMERA
navigator.mediaDevices.getUserMedia({ video: true })

.then(stream => {

    video.srcObject = stream;

})

.catch(err => {

    statusText.className = "error-state";

    statusText.innerHTML = `
        <span>Camera access denied</span>
    `;
});


// CAPTURE FACE
function capture() {

    btn.innerText = "Scanning...";
    btn.disabled = true;

    statusText.className = "";
    statusText.innerHTML = "";

    const canvas = document.createElement('canvas');

    canvas.width = 320;
    canvas.height = 240;

    const ctx = canvas.getContext('2d');

    ctx.drawImage(video, 0, 0, 320, 240);

    canvas.toBlob(blob => {

        const formData = new FormData();

        formData.append("image", blob);

        fetch("http://127.0.0.1:5000/verify", {

            method: "POST",
            body: formData

        })

        .then(res => res.json())

        .then(data => {

            console.log(data);

            // SUCCESS
            if (data.status === "granted") {

                statusText.className = "success-state";

                statusText.innerHTML = `

                    <div class="success-icon">
                        ✓
                    </div>

                    <div>
                        <div style="font-weight:700;">
                            Identity Authenticated
                        </div>

                        <div style="
                            font-size:12px;
                            opacity:0.8;
                            margin-top:2px;
                        ">
                            Secure biometric verification completed
                        </div>
                    </div>
                `;

                setTimeout(() => {

                    window.location.href = "event.php";

                }, 1500);

            }

            // FAILED
            else {

                statusText.className = "error-state";

                statusText.innerHTML = `
                    <div>
                        Authentication failed.
                        Unauthorized biometric signature detected.
                    </div>
                `;

                btn.innerText = "Retry Verification";
                btn.disabled = false;
            }

        })

        .catch(err => {

            console.error(err);

            statusText.className = "error-state";

            statusText.innerHTML = `
                <div>
                    Verification server unavailable
                </div>
            `;

            btn.innerText = "Retry Verification";
            btn.disabled = false;
        });

    });

}

</script>

</body>
</html>
